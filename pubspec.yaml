name: viikkonro
description: Finnish ISO week numbers and offline calendar tools for iOS and Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  pdf: ^3.11.3
  printing: ^5.15.0
  google_mobile_ads: ^9.1.0
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/fonts/Inter-LICENSE.txt
    - assets/fonts/Bricolage-LICENSE.txt
    - assets/fonts/PlexMono-LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage-400.ttf
        - asset: assets/fonts/Bricolage-500.ttf
          weight: 500
        - asset: assets/fonts/Bricolage-600.ttf
          weight: 600
        - asset: assets/fonts/Bricolage-700.ttf
          weight: 700
        - asset: assets/fonts/Bricolage-800.ttf
          weight: 800
    - family: PlexMono
      fonts:
        - asset: assets/fonts/PlexMono-400.ttf
        - asset: assets/fonts/PlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/PlexMono-600.ttf
          weight: 600
        - asset: assets/fonts/PlexMono-700.ttf
          weight: 700
