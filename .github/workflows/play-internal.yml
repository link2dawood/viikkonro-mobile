name: Publish Android to Play internal testing

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version, for example 1.0.1
        required: true
        type: string
      build_number:
        description: New, unused Play version code
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  publish:
    name: Build and upload AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate release inputs and secrets
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
          ADMOB_ANDROID_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_ANDROID_BANNER_AD_UNIT_ID }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::version_name must be a semantic version such as 1.0.1"
            exit 1
          }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::build_number must be a positive integer"
            exit 1
          }
          required=(
            ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_STORE_PASSWORD
            ANDROID_KEY_PASSWORD
            ANDROID_KEY_ALIAS
            ADMOB_ANDROID_APP_ID
            ADMOB_ANDROID_BANNER_AD_UNIT_ID
            FIREBASE_ANDROID_CONFIG_BASE64
            PLAY_SERVICE_ACCOUNT_JSON
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub secret $name is not configured"
              exit 1
            fi
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v6

      - name: Materialize local-only Android configuration
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
          ADMOB_ANDROID_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_ANDROID_BANNER_AD_UNIT_ID }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/viikkonro-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          chmod 600 android/app/google-services.json
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$keystore_path"
            printf 'ADMOB_PUBLISHER_ID=pub-5553975522423673\n'
            printf 'ADMOB_ANDROID_APP_ID=%s\n' "$ADMOB_ANDROID_APP_ID"
            printf 'ADMOB_ANDROID_BANNER_AD_UNIT_ID=%s\n' "$ADMOB_ANDROID_BANNER_AD_UNIT_ID"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build signed release bundle
        run: >-
          flutter build appbundle --release
          --build-name "$VERSION_NAME"
          --build-number "$BUILD_NUMBER"

      - name: Remove temporary signing and service configuration
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/viikkonro-upload.jks"
          rm -f android/key.properties
          rm -f android/app/google-services.json

      - name: Preserve release bundle
        uses: actions/upload-artifact@v7
        with:
          name: viikkonro-${{ inputs.version_name }}-${{ inputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fi.viikkonro.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ inputs.version_name }} (${{ inputs.build_number }})
          mappingFile: build/app/outputs/mapping/release/mapping.txt
