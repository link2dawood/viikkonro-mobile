name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart parity (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [Europe/Helsinki, UTC, America/New_York, Pacific/Auckland]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --reporter expanded

  android:
    name: Kotlin parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - run: flutter pub get
      - run: ./gradlew :app:testDebugUnitTest --console=plain
        working-directory: android

  ios:
    name: Swift parity
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter precache --ios
      - run: flutter build ios --simulator --config-only
      - run: pod install
        working-directory: ios
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'simulators.json')) as f:
              devices = json.load(f)['devices']
          phones = [d for runtime, group in devices.items() if 'iOS' in runtime
                    for d in group if d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('IOS_SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Run XCTest against the shared fixture
        run: >-
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner
          -configuration Debug
          -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID"
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO
